---
- name: Install apache and php packages
  ansible.builtin.dnf:
    name:
      - httpd
      - php
    state: present
- name: Start the service apache and firewall
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - httpd
    - firewalld
- name: Configure the firewall to allow HTTP traffic
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: Deploy index.html file
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: apache
    group: apache
    mode: '0644'
  notify: Restart apache
